name: APK Derle

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          sudo update-alternatives --set java /usr/lib/jvm/temurin-17-jdk-amd64/bin/java || sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java

      - name: Buildozer kur
        run: pip install buildozer==1.5.0 cython==0.29.33

      - name: APK derle (lisanslari otomatik kabul et)
        run: yes | buildozer -v android debug

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: minikkasifler-apk
          path: bin/*.apk
